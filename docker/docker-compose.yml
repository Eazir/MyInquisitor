services:
  db:
    image: postgres:16-alpine
    container_name: myinquisitor-db
    environment:
      POSTGRES_DB: myinquisitor
      POSTGRES_USER: myinquisitor_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-myinquisitor_dev}
    ports:
      - "5433:5432"
    volumes:
      - infoDbMyInquisitor:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myinquisitor_app -d myinquisitor"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myinquisitor-net

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: myinquisitor-api
    environment:
      SERVER_PORT: "8080"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgres://myinquisitor_app:${DB_PASSWORD:-myinquisitor_dev}@db:5432/myinquisitor?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-30m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-720h}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      MIGRATIONS_DIR: /migrations
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - myinquisitor-net

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: myinquisitor-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - myinquisitor-net

networks:
  myinquisitor-net:
    driver: bridge

volumes:
  infoDbMyInquisitor:
